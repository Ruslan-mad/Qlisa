# Per-project Cargo configuration.
#
# Sets CPAL_ASIO_DIR to the copy of the Steinberg ASIO SDK bundled inside the
# project at vendor/asiosdk.  This avoids depending on a system environment
# variable and ensures the build script (asio-sys) can always resolve the SDK
# regardless of how the build is launched (pnpm, VS Code tasks, CI, etc.).
#
# See: https://crates.io/crates/cpal#asio-on-windows

[env]
CPAL_ASIO_DIR = { value = "../vendor/asiosdk", relative = true }

# Keep Cargo's incremental artifacts between invocations and use all logical
# processors on the development machine.  Do not run `cargo clean` as part of
# the normal edit/check/test loop: unchanged dependencies stay compiled.
[build]
jobs = 20

# rustup ships rust-lld with every MSVC toolchain. It is the portable LLD
# linker for this target and does not depend on a machine-specific LLVM path.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
